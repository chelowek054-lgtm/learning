# Оркестрация Praxis (суперпроект). Здесь собираются ВСЕ сервисы —
# backend и будущие микросервисы/внешние сервисы (Redis, S3, worker'ы и т.п.).
# Dockerfile каждого сервиса лежит в его репозитории (сабмодуле); здесь — только сборка+связь.
# Данные контейнеров персистятся в ./.data (bind-mount, вне git).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-praxis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-praxis}
      POSTGRES_DB: ${POSTGRES_DB:-praxis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-praxis} -d ${POSTGRES_DB:-praxis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./learningBack
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-praxis}:${POSTGRES_PASSWORD:-praxis}@postgres:5432/${POSTGRES_DB:-praxis}
      # Ключи LLM — только через окружение, никогда в образ (инвариант №2).
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_GENERATION: ${OPENROUTER_MODEL_GENERATION:-google/gemini-3.7-flash}
      OPENROUTER_MODEL_SCORING: ${OPENROUTER_MODEL_SCORING:-google/gemini-3.7-flash}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    # Применяем миграции, затем поднимаем сервер.
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev uvicorn core.app:app --host 0.0.0.0 --port 8000"

  # pgAdmin — веб-UI к Postgres стенда. Dev-инструмент, а не часть продукта:
  # приложение с ним не связано, выключение ничего не ломает.
  # http://localhost:5050 — подключение «Praxis (docker)» уже прописано,
  # пароль спросит при первом коннекте (по умолчанию POSTGRES_PASSWORD).
  pgadmin:
    image: dpage/pgadmin4:9
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@praxis.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-praxis}
      # Однопользовательский режим: без экрана логина и мастер-пароля на каждый заход.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      # Named volume, а не ./.data (как у postgres): контейнер работает под uid 5050
      # и на bind-mount спотыкается о права — «Failed to create the directory
      # /var/lib/pgadmin/sessions». Здесь лежат только настройки UI, не данные проекта.
      - pgadmin-data:/var/lib/pgadmin
      # Преднастроенное подключение; читается один раз при инициализации pgAdmin.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgadmin-data:
