contract: docdd.workspace/1
project:
  id: learning
  name: learning
paths:
  requirements: requirements
  design: design
  decisions: decisions
  contracts: contracts
  tasks: tasks
  phases: phases
  tests: tests
  diagrams: diagrams
  maps: maps
  reference: reference
sources:
  shared:
    - path: builtin
      tags: [general, backend, database, fastapi, frontend, typescript, vue, infra, nuxt, postgres, python]
  # Где лежит код: по нему проверяются ссылки из документов.
  code:
    # Корень бэкенда целиком: его .gitignore (__pycache__, .venv) действует только
    # в указанной папке и глубже, поэтому подпапки по отдельности подмешивали бы *.pyc.
    - learningBack
    - learningFront/src
    - scripts
  # Где лежит старая документация: с неё начинается импорт.
  docs: []
  # Где живёт клиентская часть: по ней строится карта пользовательских путей.
  client:
    - learningFront/src
  # Где лежат сырые заметки: из них заводятся записи (docs/10-inbox.md).
  inbox: [docs/inbox]
roles:
  - id: architect
    name: Архитектор
policy:
  require_approved_docs_before_dev: true
  require_verification_before_done: true
  stale_in_progress_days: 14
  map_portion_files: 40
