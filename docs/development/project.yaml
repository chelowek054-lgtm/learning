contract: docdd.workspace/1
project:
  id: learning
  name: learning
paths:
  requirements: requirements
  design: design
  decisions: decisions
  contracts: contracts
  tasks: tasks
  phases: phases
  tests: tests
  diagrams: diagrams
  maps: maps
sources:
  # Где лежит код: по нему проверяются ссылки из документов.
  code:
    # Корень бэкенда целиком: его .gitignore (__pycache__, .venv) действует только
    # в указанной папке и глубже, поэтому подпапки по отдельности подмешивали бы *.pyc.
    - learningBack
    - learningFront/src
    - scripts
  # Где лежит старая документация: с неё начинается импорт.
  docs: []
  # Где живёт клиентская часть: по ней строится карта пользовательских путей.
  client:
    - learningFront/src
  # Где лежат сырые заметки: из них заводятся записи (docs/10-inbox.md).
  inbox: [docs/inbox]
roles:
  - id: architect
    name: Архитектор
policy:
  require_approved_docs_before_dev: true
  require_verification_before_done: true
  stale_in_progress_days: 14
  map_portion_files: 40
# Правила архитектуры (docs/07-maps.md, «Модули и публичный вход»): нет секции — нет проверки.
architecture:
  shared: [learningBack/core, learningFront/src/shared]
  siblings: via-entry
  layers:
    - root: learningFront/src
      order: [app, pages, widgets, features, entities, shared]
      slices: isolated
      # По FSD у app и shared нет срезов — только сегменты, и они видят друг друга.
      unsliced: [app, shared]
    - root: learningBack
      order: [modules, core]
      slices: via-entry
