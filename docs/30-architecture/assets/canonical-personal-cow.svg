<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img">
  <title>Канонический граф темы и персональный растущий граф пользователя (copy-on-write); узел содержит теорию, из которой генерятся тест и практика</title>
  <desc>Два уровня графа знаний: общий канонический и персональный, который наследует базу и растёт под интересы. Узел хранит формализованную теорию.</desc>
  <rect x="0" y="0" width="800" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <defs>
    <marker id="cp-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
    <marker id="cp-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
  </defs>
  <text x="24" y="30" fill="#64748b" font-size="11.5" font-weight="700">КАНОНИЧЕСКИЙ ГРАФ ТЕМЫ · общий, база (ML)</text>
  <g stroke="#94a3b8" fill="none" marker-end="url(#cp-a)"><path d="M126,58 L150,58"/><path d="M246,58 L270,58"/><path d="M366,58 L390,58"/></g>
  <g font-size="12" text-anchor="middle">
    <g><rect x="30" y="42" width="96" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="78" y="62" fill="#1f2937">Линал</text></g>
    <g><rect x="150" y="42" width="96" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="198" y="62" fill="#1f2937">Нейросети</text></g>
    <g><rect x="270" y="42" width="96" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="318" y="62" fill="#1f2937">Attention</text></g>
    <g><rect x="390" y="42" width="110" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="445" y="62" fill="#1f2937">Трансформеры</text></g>
  </g>
  <path d="M250,80 L250,120" stroke="#2563eb" stroke-width="1.4" fill="none" marker-end="url(#cp-b)"/>
  <text x="264" y="104" fill="#2563eb" font-size="10.5">новый юзер наследует базу · copy-on-write при правке</text>
  <text x="24" y="146" fill="#64748b" font-size="11.5" font-weight="700">ПЕРСОНАЛЬНЫЙ ГРАФ · растёт под интересы пользователя</text>
  <g stroke="#94a3b8" fill="none" marker-end="url(#cp-a)"><path d="M126,176 L150,176"/><path d="M246,176 L270,176"/></g>
  <g stroke="#2563eb" fill="none" marker-end="url(#cp-b)" stroke-dasharray="4 3"><path d="M366,176 L390,164"/><path d="M486,158 L506,158"/></g>
  <g font-size="12" text-anchor="middle">
    <g><rect x="30" y="160" width="96" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8"/><circle cx="116" cy="168" r="4" fill="#64748b"/><text x="78" y="180" fill="#1f2937">Линал</text></g>
    <g><rect x="150" y="160" width="96" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8"/><circle cx="236" cy="168" r="4" fill="#64748b"/><text x="198" y="180" fill="#1f2937">Нейросети</text></g>
    <g><rect x="270" y="160" width="96" height="32" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-dasharray="4 3"/><text x="318" y="180" fill="#1f2937">Attention</text></g>
    <g><rect x="390" y="142" width="96" height="32" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="438" y="162" fill="#1f2937" font-size="11">Flash-attn</text></g>
    <g><rect x="506" y="142" width="96" height="32" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="554" y="162" fill="#1f2937" font-size="11">KV-cache</text></g>
  </g>
  <text x="438" y="192" fill="#2563eb" font-size="10" text-anchor="middle">LLM дорастил ветку ↑</text>
  <rect x="630" y="40" width="156" height="210" rx="12" fill="none" stroke="#94a3b8"/>
  <text x="708" y="60" fill="#1f2937" font-size="11.5" font-weight="700" text-anchor="middle">Внутри узла</text>
  <g text-anchor="middle" font-size="11">
    <g><rect x="648" y="72" width="120" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="708" y="88" fill="#1f2937">Теория</text><text x="708" y="103" fill="#64748b" font-size="9.5">формализована в БЗ</text></g>
    <path d="M708,114 L708,138" stroke="#94a3b8" fill="none" marker-end="url(#cp-a)"/>
    <text x="724" y="130" fill="#64748b" font-size="9" text-anchor="start">генерит</text>
    <g><rect x="648" y="142" width="120" height="34" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="708" y="163" fill="#1f2937">Авто-тест</text></g>
    <g><rect x="648" y="184" width="120" height="34" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="708" y="205" fill="#1f2937">Практика</text></g>
  </g>
  <g font-size="10.5" fill="#64748b">
    <circle cx="34" cy="230" r="4" fill="#64748b"/><text x="44" y="234">освоено</text>
    <rect x="150" y="224" width="14" height="11" rx="3" fill="#f8fafc" stroke="#2563eb" stroke-dasharray="4 3"/><text x="170" y="234">граница (учим)</text>
    <rect x="310" y="224" width="14" height="11" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="330" y="234">доросло (LLM)</text>
  </g>
</svg>
