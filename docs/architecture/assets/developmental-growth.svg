<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img">
  <title>Развитийный рост знаний: обязательное ядро → дифференциация → ветки по интересу → фронтир (ZPD) → спиральный возврат</title>
  <desc>Граф знаний растёт от фундаментального обязательного ядра вверх к цели, с боковыми ветками по интересу и спиральным возвратом к ядру на более высоком уровне.</desc>
  <rect x="0" y="0" width="780" height="420" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <defs>
    <marker id="dg-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
    <marker id="dg-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
  </defs>
  <line x1="30" y1="205" x2="640" y2="205" stroke="#2563eb" stroke-dasharray="6 4" opacity="0.7"/>
  <text x="30" y="199" fill="#2563eb" font-size="10.5">фронтир (ZPD) — растём здесь; ниже освоено, выше учим</text>
  <g stroke="#94a3b8" fill="none" marker-end="url(#dg-a)">
    <path d="M150,330 L232,271"/><path d="M330,330 L248,271"/><path d="M330,330 L422,271"/><path d="M520,330 L438,271"/>
    <path d="M240,235 L322,176"/><path d="M430,235 L348,176"/><path d="M335,140 L335,84"/>
  </g>
  <g stroke="#2563eb" fill="none" marker-end="url(#dg-b)" stroke-dasharray="5 3"><path d="M435,235 L602,176"/></g>
  <g font-size="12" text-anchor="middle">
    <rect x="270" y="48" width="130" height="36" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2.4"/><text x="335" y="71" fill="#2563eb" font-weight="700">★ Цель</text>
    <rect x="280" y="140" width="110" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="335" y="161" fill="#1f2937" font-size="11">дифференциация</text>
    <rect x="560" y="140" width="120" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="5 3"/><text x="620" y="161" fill="#1f2937" font-size="11">ветка интереса</text>
    <rect x="185" y="235" width="110" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="240" y="256" fill="#1f2937" font-size="11">общее→частное</text>
    <rect x="380" y="235" width="110" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="435" y="256" fill="#1f2937" font-size="11">общее→частное</text>
  </g>
  <rect x="60" y="322" width="510" height="60" rx="12" fill="none" stroke="#cbd5e1"/>
  <text x="72" y="338" fill="#64748b" font-size="10.5" font-weight="700">ФУНДАМЕНТАЛЬНОЕ ЯДРО · обязательный основной граф</text>
  <g font-size="12" text-anchor="middle">
    <g><rect x="90" y="346" width="110" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8"/><circle cx="190" cy="354" r="4" fill="#64748b"/><text x="145" y="366" fill="#1f2937" font-size="11">примитив</text></g>
    <g><rect x="280" y="346" width="110" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8"/><circle cx="380" cy="354" r="4" fill="#64748b"/><text x="335" y="366" fill="#1f2937" font-size="11">примитив</text></g>
    <g><rect x="470" y="346" width="110" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8"/><circle cx="570" cy="354" r="4" fill="#64748b"/><text x="525" y="366" fill="#1f2937" font-size="11">примитив</text></g>
  </g>
  <path d="M405,60 Q740,210 560,352" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#dg-b)" opacity="0.85"/>
  <text x="690" y="205" fill="#2563eb" font-size="10" text-anchor="middle" transform="rotate(90 690 205)">спираль: возврат к ядру глубже (выше по Блуму)</text>
